# Site settings
title: my282's Notes
description: >-
  Writeups and technical notes.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://my282.github.io" # the base hostname & protocol for your site
github_username: my282

# Build settings
theme: just-the-docs

# Just the Docs settings
# https://just-the-docs.com/docs/configuration/
color_scheme: dark

# Aux links shown in the top-right of the header
aux_links:
  "my282 on GitHub":
    - "https://github.com/my282"

# Enables the "Edit this page on GitHub" style links; harmless if unused
# gh_edit_link: true
# gh_edit_link_text: "Edit this page on GitHub"
# gh_edit_repository: "https://github.com/my282/my282.github.io"
# gh_edit_branch: "main"

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 2
  preview_words_before: 3
  preview_words_after: 3
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true

# Sort navigation by nav_order, falling back to title
nav_sort: case_insensitive

back_to_top: true
back_to_top_text: "Back to top"

footer_content: ""

# Exclude from processing.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
